server:
  port: 8080

# Vert.x WebSocket 配置
vertx:
  websocket:
    port: ${VERTX_WS_PORT:8081}

spring:
  application:
    name: agent-web

  # JSON 配置
  jackson:
    serialization:
      indent_output: true
      write_dates_as_timestamps: false
    default-property-inclusion: non_null

# 日志配置
logging:
  level:
    root: INFO
    com.lightweightai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 应用配置
app:
  mock-mode: true  # 默认使用 mock 模式，不需要真实 API Key
  provider-type: ${PROVIDER_TYPE:mock}  # 可选: mock, api, pro, openrouter
  claude:
    # 官方API配置
    api-key: ${ANTHROPIC_API_KEY:}  # 从环境变量读取，为空则使用 mock
    model: claude-3-5-sonnet-20241022
    # Claude Pro配置（使用网页版会员）
    session-key: ${CLAUDE_SESSION_KEY:}  # 从浏览器Cookie获取的sessionKey
    organization-id: ${CLAUDE_ORG_ID:}  # 可选，会自动获取
  openrouter:
    # OpenRouter配置（支持多种模型）
    api-key: ${OPENROUTER_API_KEY:}  # OpenRouter API Key
    model: ${OPENROUTER_MODEL:anthropic/claude-3.5-sonnet}  # 模型选择
  soul:
    db-path: ${SOUL_DB_PATH:./data/soul_data.db}
    crisis-detection: true
  web-search:
    enabled: true
    api-key: ${WEB_SEARCH_API_KEY:}   # 留空 → Mock 模式
    provider: brave                    # 预留：brave | serper
    max-results: 3
  # MCP 远程工具配置
  # 启用后，Spring 启动时自动连接 MCP Server，远程工具注册到 ToolRegistry
  # LLM 通过 ToolCallingLoop 可以透明调用这些远程工具
  mcp:
    enabled: ${MCP_ENABLED:false}  # 设置 MCP_ENABLED=true 启用
    servers:
      # 示例：本项目 Demo MCP Server
      # demo-agent:
      #   command: java
      #   args: -cp,classpath,com.lightweightai.demo.McpServerRunner
      #   timeout: 60
      #
      # 示例：NPM MCP Server
      # weather:
      #   command: npx
      #   args: -y,@weather/mcp-server
      #   env: API_KEY=${WEATHER_API_KEY}
      #   timeout: 30
      #
      # 示例：SSE 远程 MCP Server
      # remote-api:
      #   transport: sse
      #   url: http://api-server:8080/sse
      #   timeout: 45

  speech:
    # 语音服务配置
    provider: ${SPEECH_PROVIDER:openai}  # 可选: azure, openai, mock
    azure:
      # Azure Speech Services（推荐中文情感TTS）
      api-key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:eastasia}  # eastasia, southeastasia
      voice: ${AZURE_SPEECH_VOICE:zh-CN-XiaoxiaoNeural}  # 晓晓(女声)
    openai:
      # OpenAI Speech (Whisper + TTS)
      api-key: ${OPENAI_SPEECH_KEY:}  # 为空则使用OpenRouter Key
      voice: ${OPENAI_SPEECH_VOICE:nova}  # nova=温柔, shimmer=活泼, alloy=平衡

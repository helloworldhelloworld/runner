server:
  port: 8080

# Vert.x WebSocket 配置
vertx:
  websocket:
    port: ${VERTX_WS_PORT:8081}

spring:
  application:
    name: agent-web

  # JSON 配置
  jackson:
    serialization:
      indent_output: true
      write_dates_as_timestamps: false
    default-property-inclusion: non_null

# 日志配置
logging:
  level:
    root: INFO
    com.lightweightai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 应用配置
app:
  mock-mode: false  # mock模式已废弃，provider-type=auto时自动检测
  provider-type: ${PROVIDER_TYPE:auto}  # 可选: auto, api, pro, openrouter, mock。auto=按优先级自动检测可用的API Key
  claude:
    # 官方API配置
    api-key: ${ANTHROPIC_API_KEY:}  # 从环境变量读取，为空则使用 mock
    model: claude-3-5-sonnet-20241022
    # Claude Pro配置（使用网页版会员）
    session-key: ${CLAUDE_SESSION_KEY:}  # 从浏览器Cookie获取的sessionKey
    organization-id: ${CLAUDE_ORG_ID:}  # 可选，会自动获取
  openrouter:
    # OpenRouter / OpenAI兼容API配置（支持多种模型）
    api-key: ${OPENROUTER_API_KEY:}  # API Key（部分自建服务可留空）
    model: ${OPENROUTER_MODEL:anthropic/claude-3.5-sonnet}  # 模型选择
    base-url: ${OPENROUTER_BASE_URL:}  # 自定义API地址，留空则默认OpenRouter。示例: http://10.32.101.24:8086/llm/openai
  # 工具调用（function calling）开关
  # 部分自建 LLM 网关不支持 tools 参数，设为 false 关闭
  tools-enabled: ${TOOLS_ENABLED:true}
  soul:
    db-path: ${SOUL_DB_PATH:./data/soul_data.db}
    crisis-detection: true
  web-search:
    enabled: true
    api-key: ${WEB_SEARCH_API_KEY:}   # 留空 → Mock 模式
    provider: brave                    # 预留：brave | serper
    max-results: 3
  # MCP 远程工具配置
  # 启用后，Spring 启动时自动连接 MCP Server，远程工具注册到 ToolRegistry
  # LLM 通过 ToolCallingLoop 可以透明调用这些远程工具
  #
  # 动态 Header 支持：声明一个 McpHeaderProvider Bean 即可，与 server 注册解耦
  # 框架启动时自动合并 静态 headers（下方配置）+ 动态 headers（Provider Bean）
  mcp:
    enabled: ${MCP_ENABLED:false}  # 设置 MCP_ENABLED=true 启用
    servers:
      # 示例：STDIO 本地 MCP Server
      # demo-agent:
      #   command: java
      #   args:
      #     - -cp
      #     - classpath
      #     - com.lightweightai.demo.McpServerRunner
      #   timeout: 60
      #
      # 示例：SSE 远程 MCP Server（带静态 header）
      # remote-api:
      #   transport: sse
      #   url: http://api-server:8080/sse
      #   timeout: 45
      #   headers:
      #     X-API-Key: "${REMOTE_API_KEY:}"
      #     X-Client-Version: "1.0"
      #
      # 示例：Streamable HTTP（动态 header 由 McpHeaderProvider Bean 注入）
      # auth-service:
      #   transport: streamable_http
      #   url: http://auth-server:8080/mcp
      #   timeout: 30

  speech:
    # 语音服务配置
    provider: ${SPEECH_PROVIDER:openai}  # 可选: azure, openai, mock
    azure:
      # Azure Speech Services（推荐中文情感TTS）
      api-key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:eastasia}  # eastasia, southeastasia
      voice: ${AZURE_SPEECH_VOICE:zh-CN-XiaoxiaoNeural}  # 晓晓(女声)
    openai:
      # OpenAI Speech (Whisper + TTS)
      api-key: ${OPENAI_SPEECH_KEY:}  # 为空则使用OpenRouter Key
      voice: ${OPENAI_SPEECH_VOICE:nova}  # nova=温柔, shimmer=活泼, alloy=平衡

name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore:
      - 'ci-results/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        id: build
        run: |
          set +e
          mvn -B package --no-transfer-progress 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          TEST_SUMMARY=$(grep -E "Tests run:" /tmp/build.log | tail -10 | tr '\n' '|' || echo "N/A")
          echo "test_summary=$TEST_SUMMARY" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Write CI results back to repo
        if: always()
        run: |
          mkdir -p ci-results
          EXIT="${{ steps.build.outputs.exit_code }}"
          [ -z "$EXIT" ] && EXIT=1

          # 写元数据
          printf '{\n  "trigger_sha": "%s",\n  "exit_code": %s,\n  "timestamp": "%s",\n  "branch": "%s",\n  "run_id": "%s",\n  "test_summary": "%s"\n}\n' \
            "${{ github.sha }}" \
            "$EXIT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.ref_name }}" \
            "${{ github.run_id }}" \
            "${{ steps.build.outputs.test_summary }}" \
            > ci-results/latest.json

          # 写日志（build.log 一定存在，因为 set +e 保证了 tee 完整执行）
          if [ -f /tmp/build.log ]; then
            cp /tmp/build.log ci-results/build.log
          else
            echo "(build did not produce log)" > ci-results/build.log
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-results/
          git commit -m "ci-results: ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git push

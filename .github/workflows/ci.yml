name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore:
      - 'ci-results/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        id: build
        run: |
          mvn -B package --no-transfer-progress 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          TEST_SUMMARY=$(grep -E "Tests run:" /tmp/build.log | tail -5 | tr '\n' '|' || echo "N/A")
          echo "test_summary=$TEST_SUMMARY" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Write CI results back to repo
        if: always()
        run: |
          mkdir -p ci-results
          EXIT=${{ steps.build.outputs.exit_code }}
          [ -z "$EXIT" ] && EXIT=1
          cat > ci-results/latest.json << JSONEOF
          {
            "trigger_sha": "${{ github.sha }}",
            "exit_code": $EXIT,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "test_summary": "${{ steps.build.outputs.test_summary }}"
          }
          JSONEOF
          cp /tmp/build.log ci-results/build.log 2>/dev/null || echo "(no log)" > ci-results/build.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-results/
          git commit -m "ci-results: ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git push

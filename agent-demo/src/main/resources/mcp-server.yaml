# ===========================================================
# McpServerRunner 统一配置
#
# 架构：
#   McpClientDemo ──STDIO──→ McpServerRunner ──MCP SDK──→ 外部已有 MCP Server
#                            (本文件配置)
#
# McpServerRunner 启动时自动加载此文件：
#   1. 读取 server 配置，初始化 McpToolServer
#   2. 通过官方 MCP SDK 连接 upstream 中已启用的外部 MCP Server
#   3. 发现并代理上游工具，和本地工具一起暴露给 Client
#
# 上游 MCP Server 是外部已有的服务，只需配置连接信息：
#   - SSE: 配置 url 指向已运行的 MCP Server
#   - STDIO: 配置 command + args 启动已有的 MCP Server 进程
#
# 自定义配置路径：-Dmcp.server.config=/path/to/config.yaml
# ===========================================================

# MCP Server 自身配置
server:
  name: demo-agent
  version: 0.1.0

# 上游 MCP Server 配置（McpServerRunner 通过官方 MCP SDK 连接）
# 外部已有的 MCP Server，只需配置，不需要实现
upstream:
  servers:

    # ------ SSE/HTTP 远程调用 ------
    # 连接外部已运行的 MCP Server，通过 HTTP/SSE 协议通信

    # 示例：远程 NLP 服务
    #nlp-service:
    #  transport: sse
    #  url: "http://localhost:8081"
    #  timeoutSeconds: 30

    # 示例：Brave 搜索 MCP Server
    #brave-search:
    #  transport: sse
    #  url: "http://brave-search-mcp:8080"
    #  timeoutSeconds: 30

    # ------ STDIO 本地进程 ------
    # 通过 STDIO 启动已有的 MCP Server 进程

    # 测试用：最简 MCP Server（echo + random_number）
    test-server:
      transport: stdio
      command: java
      args: ["-cp", "${CLASSPATH}", "com.lightweightai.demo.TestMcpServer"]
      timeoutSeconds: 10

    # 示例：文件系统 MCP Server（官方）
    #filesystem:
    #  transport: stdio
    #  command: npx
    #  args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    #  timeoutSeconds: 30


# ===========================================================
# McpServerRunner 统一配置
#
# 包含两部分：
#   server   — MCP Server 自身配置（名称、版本）
#   upstream — 上游 MCP Server 连接配置
#
# McpServerRunner 启动时自动加载此文件：
#   1. 读取 server 配置，初始化 McpToolServer
#   2. 连接 upstream 中已启用的上游 Server（MCP SDK）
#   3. 发现并代理上游工具，和本地工具一起暴露
#
# 完整链路：
#   外部 Client ──MCP──→ McpServerRunner ──MCP/SSE──→ 上游 Server
#                        (server 配置)                 (upstream 配置)
#
# 自定义配置路径：-Dmcp.server.config=/path/to/config.yaml
# ===========================================================

# MCP Server 自身配置
server:
  name: demo-agent
  version: 0.1.0

# 上游 MCP Server 配置（McpServerRunner 作为 Client 连接）
upstream:
  servers:

    # ------ SSE/HTTP 远程调用（真正的 RPC） ------

    # 远程 NLP 服务（翻译、释义、情感分析）
    # 需要先在远程主机上启动 UpstreamExampleServer 的 HTTP/SSE 端口
    # 示例启动命令（远程）: java -cp <classpath> com.lightweightai.demo.UpstreamExampleServer --sse --port 8081
    nlp-service:
      transport: sse
      url: "http://localhost:8081/sse"
      timeoutSeconds: 30
      enabled: false

    # 远程 API 服务
    #remote-api:
    #  transport: sse
    #  url: "http://api-server:8080/sse"
    #  timeoutSeconds: 45

    # ------ STDIO 本地进程（开发/测试用） ------

    # 本地 NLP 服务（STDIO 子进程模式，开发时使用）
    nlp-service-local:
      transport: stdio
      command: java
      args:
        - "-cp"
        - "${CLASSPATH}"
        - "com.lightweightai.demo.UpstreamExampleServer"
      timeoutSeconds: 30
      enabled: true

    # 文件系统 MCP Server
    #filesystem:
    #  transport: stdio
    #  command: npx
    #  args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    #  timeoutSeconds: 30


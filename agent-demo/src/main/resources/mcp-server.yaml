# ===========================================================
# McpServerRunner 统一配置
#
# 架构：
#   McpClientDemo ──STDIO──→ McpServerRunner ──MCP SDK──→ 外部已有 MCP Server
#                            (本文件配置)
#
# McpServerRunner 启动时自动加载此文件：
#   1. 读取 server 配置，初始化 McpToolServer
#   2. 通过官方 MCP SDK 连接 upstream 中已启用的外部 MCP Server
#   3. 发现并代理上游工具，和本地工具一起暴露给 Client
#
# 上游 MCP Server 是外部已有的服务，只需配置连接信息：
#   - SSE: 配置 url 指向已运行的 MCP Server
#   - STDIO: 配置 command + args 启动已有的 MCP Server 进程
#
# 自定义配置路径：-Dmcp.server.config=/path/to/config.yaml
# ===========================================================

# MCP Server 自身配置
server:
  name: demo-agent
  version: 0.1.0

# 上游 MCP Server 配置（McpServerRunner 通过官方 MCP SDK 连接）
# 外部已有的 MCP Server，只需配置，不需要实现
upstream:
  servers:

    # ------ Streamable HTTP 远程调用（推荐） ------
    # 新版 MCP 传输协议（2025-03-26+），直接 POST 到 MCP 端点
    # transport 值：streamable_http 或 http

    # HTTP 远程 MCP Server
    # 修改 url 指向你的 HTTP MCP Server 地址，设置 enabled: true 启用
    # DeepWiki 公开 MCP Server（免费，无需认证）
    # 提供 GitHub 公开仓库的 wiki 查询能力
    deepwiki:
      transport: http
      url: "https://mcp.deepwiki.com/mcp"
      timeoutSeconds: 30
      enabled: true

    # 内部 HTTP 远程 MCP Server（按需启用）
    http-upstream:
      transport: http
      url: "http://10.97.134.15:6645/searchgate/mcp"
      timeoutSeconds: 30
      enabled: false

    # SSE 远程 MCP Server（复用同一服务地址，SSE 传输）
    sse-upstream:
      transport: sse
      url: "http://10.97.134.15:6645/searchgate"
      timeoutSeconds: 30
      enabled: false

    # 示例：远程 NLP 服务
    #nlp-service:
    #  transport: streamable_http
    #  url: "http://localhost:8081/mcp"
    #  timeoutSeconds: 30

    # 示例：带认证 Header 的远程服务
    #auth-service:
    #  transport: streamable_http
    #  url: "http://api-server:8080/mcp"
    #  timeoutSeconds: 30
    #  headers:
    #    Authorization: "Bearer ${API_TOKEN}"
    #    X-Trace-Id: "my-trace-id"

    # ------ SSE 远程调用（旧版） ------
    # 旧版 SSE 传输协议，先 GET /sse 建立长连接，再 POST 请求

    # 示例：Brave 搜索 MCP Server
    #brave-search:
    #  transport: sse
    #  url: "http://brave-search-mcp:8080"
    #  timeoutSeconds: 30

    # ------ STDIO 本地进程 ------
    # 通过 STDIO 启动已有的 MCP Server 进程

    # 测试用：最简 MCP Server（echo + random_number）
    #test-server:
    #  transport: stdio
    #  command: java
    #  args: ["-cp", "${CLASSPATH}", "com.lightweightai.demo.TestMcpServer"]
    #  timeoutSeconds: 10

    # 网页抓取 MCP Server（官方免费，无需 API Key）
    fetch-server:
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-fetch"]
      enabled: true
      timeoutSeconds: 30

    # 示例：文件系统 MCP Server（官方）

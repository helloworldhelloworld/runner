# ===========================================================
# MCP 远程 Server 配置文件
#
# 配合 McpToolManager.create().fromConfig(config).build() 使用
# 框架自动对每个 enabled server 执行：
#   connect → discover → register → 注入 ToolRegistry
#
# 支持两种传输方式：
#   stdio - 启动本地子进程，通过 stdin/stdout 通信
#   sse   - 连接远程 HTTP 端点，通过 Server-Sent Events 通信
#
# 使用方式：
#   1. 先启动 demo-agent:
#      mvn -pl agent-demo exec:java -Dexec.mainClass=com.lightweightai.demo.McpServerRunner
#   2. 其他 server 按需安装后设置 enabled: true
# ===========================================================

mcp:
  servers:

    # ------ 本项目 Demo MCP Server（开箱即用） ------

    # demo-agent: 本地工具 + 上游 MCP Server 代理
    # McpServerRunner 自动从 mcp-server.yaml 加载上游 Server 配置
    # 启动方式: mvn -pl agent-demo exec:java -Dexec.mainClass=com.lightweightai.demo.McpServerRunner
    demo-agent:
      transport: stdio
      command: mvn
      args:
        - "-pl"
        - "agent-demo"
        - "exec:java"
        - "-Dexec.mainClass=com.lightweightai.demo.McpServerRunner"
      timeoutSeconds: 60

    # 网页抓取 MCP Server（官方免费）
    fetch:
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@modelcontextprotocol/server-fetch"
      enabled: true
      timeoutSeconds: 30

    # DeepWiki 公开 MCP Server（免费，无需认证）
    deepwiki:
      transport: http
      url: "https://mcp.deepwiki.com/mcp"
      enabled: true
      timeoutSeconds: 30

    # ------ 以下为外部 MCP Server 示例，默认禁用 ------

    # 天气查询 MCP Server（需要先 npm install）
    weather:
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@weather/mcp-server"
      env:
        API_KEY: "${WEATHER_API_KEY}"
      enabled: false
      timeoutSeconds: 30

    # 文件系统 MCP Server（官方）
    filesystem:
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
        - "/tmp"
      enabled: false
      timeoutSeconds: 30

    # SQLite 数据库 MCP Server
    database:
      transport: stdio
      command: python
      args:
        - "-m"
        - "mcp_server_sqlite"
        - "--db"
        - "data.db"
      env:
        SQLITE_PATH: "/data/app.db"
      enabled: false
      timeoutSeconds: 60

    # ------ SSE 类型：远程 HTTP MCP Server ------

    # 远程 API 服务（示例，需替换为实际地址）
    # headers 仅 SSE / Streamable HTTP 生效，可配合 McpHeaderProvider 动态覆盖
    remote-api:
      transport: sse
      url: "http://api-server.example.com:8080/sse"
      headers:
        X-API-Key: "${REMOTE_API_KEY}"
        X-Client-Version: "1.0.0"
      enabled: false
      timeoutSeconds: 45
